services:
  - type: web
    name: medagama-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./
    region: frankfurt
    plan: starter
    healthCheckPath: /api/health

    preDeployCommand: "php artisan migrate --force"

    envVars:
      - key: APP_NAME
        value: Medagama
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      # Şifresiz demo girişi. Kasıtlı bir kimlik doğrulama atlaması olduğu için
      # üretimde AÇIKÇA kapatılıyor — varsayılana güvenmek yetmez.
      - key: DEMO_LOGIN_ENABLED
        value: false
      # Veritabanını yeniden kuran uç. Aynı gerekçe: niyet yazılı olmalı,
      # varsayılana güvenilmemeli. Anahtar da burada TANIMSIZ bırakılıyor —
      # tanımsız anahtar ucu tümüyle kapatıyor (config/app.php'ye bak).
      - key: ALLOW_DESTRUCTIVE_INIT
        value: false
      # Canlı altyazı (Deepgram, ABD). Görüşmenin sesi üçüncü taraf bir bulutta
      # işlenir; KVKK Md. 9 / HIPAA gereği BAA ve açık rıza olmadan açılamaz.
      # Varsayılanı zaten `false` ama üçüncü kez aynı hatayı yapmıyoruz:
      # güvenlik kararı üretim dosyasında YAZILI olmalı.
      - key: TELEHEALTH_RECORDING
        value: false
      # Teşhis başlığı (Server-Timing, X-Sorgu-Sayisi): sorgu sayısını, süreyi
      # ve istisna sınıfının adını yanıta yazıyor. Varsayılanı `false` ama
      # dosyada BEYAN EDİLMEDİĞİ için Render panelinden verilen değer sessizce
      # kazanıyordu — canlıda açıktı. Beyan edilince niyet dosyada duruyor ve
      # panelden yapılan bir değişiklik açık bir sapma hâline geliyor.
      - key: TIMING_HEADER
        value: false
      - key: APP_KEY
        sync: false           # Set in Render dashboard → Environment
      - key: APP_URL
        sync: false           # e.g. https://medagama-backend.onrender.com

      # ── Database (TiDB Cloud / MySQL) ──
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false           # TiDB Cloud gateway host
      - key: DB_PORT
        value: "4000"
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: MYSQL_ATTR_SSL_CA
        value: /etc/ssl/cert.pem   # Alpine system CA; override if needed

      # ── Frontend origin (Vercel) ──
      - key: CORS_ALLOWED_ORIGINS
        sync: false           # e.g. https://medagama.vercel.app,https://medagama.com
      - key: FRONTEND_URL
        sync: false

      # ── Queue / Cache ──
      # Default: database driver (Render starter has no Redis → deploy stays green).
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_DRIVER
        value: database
      - key: SESSION_DRIVER
        value: database

      # ── Redis (OPT-IN — leave unset to keep database cache/queue) ──
      # To enable Redis: provision a Redis service, then set these and switch
      # QUEUE_CONNECTION=redis / CACHE_STORE=redis above. If unset, the app keeps
      # using the database driver — nothing breaks.
      # - key: REDIS_HOST
      #   sync: false          # Redis host
      # - key: REDIS_PORT
      #   value: "6379"
      # - key: REDIS_PASSWORD
      #   sync: false          # Redis password (or leave null)

      # ── Mail ──
      # Hata bildirimi. DSN gizli bir kimlik bilgisi değildir — yalnızca olay
      # GÖNDERMEYE yarar, veri okumaya değil; bu yüzden burada açık durabilir.
      - key: SENTRY_LARAVEL_DSN
        value: https://3a7995b14f91ee94e6f79a6817043205@o4511896657592320.ingest.de.sentry.io/4511896694030416
      - key: SENTRY_ENVIRONMENT
        value: production
      # ── E-posta (Resend) ──
      # Burada `value:` yazılan her alan, panelden yapılan düzenlemeyi sonraki
      # deploy'da geri alır. MAIL_MAILER'da sabit "smtp" yazıyordu: panele
      # "resend" girilse bile ilk deploy'da smtp'ye dönerdi ve e-posta sessizce
      # gitmemeye başlardı. Panelden yönetilenler artık sync:false.
      - key: MAIL_MAILER
        sync: false           # resend
      - key: RESEND_API_KEY
        sync: false           # Resend panelinden üretilen anahtar
      - key: MAIL_FROM_ADDRESS
        sync: false           # alan adı doğrulanana kadar onboarding@resend.dev
      - key: MAIL_FROM_NAME
        value: Medagama
