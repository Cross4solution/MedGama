[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
logfile_maxbytes=5MB

; Web sunucusu + arka plan süreçleri.
;
; Daha önce burada YALNIZCA nginx ve php-fpm vardı. Zamanlanmış görevler ve
; kuyruk kodda tanımlıydı ama onları çalıştıracak hiçbir süreç yoktu; sonuç:
;   • randevu hatırlatmaları (24s/1s) hiç gönderilmedi,
;   • geçmiş randevular hiç otomatik tamamlanmadı,
;   • KVKK/GDPR saklama süresi dolan kayıtlar hiç silinmedi (uyum yükümlülüğü),
;   • kuyruğa yazılan tüm bildirim/e-postalar işlenmeden birikti.

[program:php-fpm]
command=php-fpm --nodaemonize
autostart=true
autorestart=true
priority=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -c /etc/nginx/nginx.conf -g "daemon off;"
autostart=true
autorestart=true
priority=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Zamanlayıcı: routes/console.php içindeki işleri saati gelince çalıştırır
; (randevu hatırlatmaları, otomatik tamamlama, GDPR veri temizliği).
; schedule:work dakikada bir kontrol eden uzun ömürlü bir süreçtir — sistem
; cron'una ihtiyaç duymaz, konteyner içinde çalışır.
[program:scheduler]
command=php /var/www/html/artisan schedule:work
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
priority=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Kuyruk işçisi: e-posta ve bildirimler kuyruğa yazılıyor (17 bildirim sınıfı
; ShouldQueue). İşçi olmadan hiçbiri gönderilmiyordu.
; --max-time: süreç saatte bir yenilenir (uzun ömürlü PHP süreçlerinde bellek
; sızıntısına karşı standart önlem). --tries/--backoff: geçici SMTP hatalarında
; mesajı hemen çöpe atmadan tekrar dener.
[program:queue]
; Bağlantı açıkça "database": uygulama sync'e ayarlıysa işler zaten anında
; çalışır ve bu işçi boş bir kuyrukta zararsızca bekler; database ise işleri o
; alır. Böylece ortam değişkeni ne olursa olsun süreç çökmez.
command=php /var/www/html/artisan queue:work database --sleep=3 --tries=3 --backoff=30 --max-time=3600
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
priority=4
stopwaitsecs=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
